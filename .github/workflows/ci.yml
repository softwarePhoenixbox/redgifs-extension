name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # lee "packageManager" de package.json
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile # postinstall = wxt prepare (genera .wxt/ con los tipos)
      - run: pnpm compile

  unit:
    # Windows incluido: el desarrollo se hace en Windows y las rutas/saltos de línea cambian.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Orden aleatorio (ver vitest.config.ts); la semilla queda impresa en el log para reproducir un fallo:
      #   pnpm vitest run --sequence.seed=<semilla>
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:all
      - run: pnpm build:firefox -- --mode basic
      - run: node scripts/check-editions.mjs # basic no contiene código premium, permisos por edición, CSP
      - run: pnpm exec web-ext lint --source-dir .output/firefox-mv2-basic

  ci-gate:
    if: always()
    needs: [static, unit, builds]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ '${{ contains(needs.*.result, 'failure') }}' == 'true' || '${{ contains(needs.*.result, 'cancelled') }}' == 'true' ]]; then
            exit 1
          fi
