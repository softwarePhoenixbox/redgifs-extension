name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Zip extensions
        run: |
          pnpm zip
          pnpm zip:firefox

      - name: Duplicate chrome build for other Chromium browsers
        run: |
          cd .output
          CHROME_ZIP=$(ls *-chrome.zip)
          BASE_NAME=$(basename "$CHROME_ZIP" -chrome.zip)
          for browser in edge brave opera whale; do
            cp "$CHROME_ZIP" "${BASE_NAME}-${browser}.zip"
          done
          cd ..

      - name: Upload zips to release
        uses: softprops/action-gh-release@v2
        with:
          files: .output/*.zip

  build-safari:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build for Safari
        run: pnpm wxt build -b safari

      - name: Convert to Xcode project
        run: |
          xcrun safari-web-extension-converter .output/safari-mv2 \
            --project-location .output/safari-xcode \
            --app-name "RedGifs Downloader" \
            --bundle-identifier com.dao088.redgifs-downloader \
            --no-open \
            --no-prompt \
            --force

      - name: Locate and build Xcode project
        run: |
          XCODEPROJ=$(find .output/safari-xcode -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          echo "Found project: $XCODEPROJ"
          PROJECT_DIR=$(dirname "$XCODEPROJ")
          SCHEME_NAME=$(basename "$XCODEPROJ" .xcodeproj)
          cd "$PROJECT_DIR"
          xcodebuild -project "$(basename "$XCODEPROJ")" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip the built app
        run: |
          APP_PATH=$(find .output/safari-xcode -name "*.app" -path "*/Release/*" | head -n 1)
          echo "Found app: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" .output/safari-app.zip

      - name: Upload Safari build to release
        uses: softprops/action-gh-release@v2
        with:
          files: .output/safari-app.zip