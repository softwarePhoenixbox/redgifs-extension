name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Zip extensions
        run: |
          pnpm zip
          pnpm zip:firefox

      - name: Duplicate chrome build for other Chromium browsers
        run: |
          cd .output
          CHROME_ZIP=$(ls *-chrome.zip)
          BASE_NAME=$(basename "$CHROME_ZIP" -chrome.zip)
          for browser in edge brave opera whale; do
            cp "$CHROME_ZIP" "${BASE_NAME}-${browser}.zip"
          done
          cd ..

      - name: Upload zips to release
        uses: softprops/action-gh-release@v2
        with:
          files: .output/*.zip

  build-safari:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build for Safari
        run: pnpm wxt build -b safari

      - name: Convert to Xcode project
        run: |
          rm -rf .output/safari-xcode
          xcrun safari-web-extension-converter .output/safari-mv2 \
            --project-location .output/safari-xcode \
            --app-name "RedGifs Downloader" \
            --bundle-identifier com.dao088.redgifs-downloader \
            --macos-only \
            --no-open \
            --no-prompt \
            --force

      - name: Fix bundle identifier mismatch
        run: |
          PBXPROJ=$(find .output/safari-xcode -name "project.pbxproj" | head -n 1)
          echo "Patching: $PBXPROJ"
          sed -i '' 's/com\.dao088\.RedGifs-Downloader/com.dao088.redgifs-downloader/g' "$PBXPROJ"
          grep -i "PRODUCT_BUNDLE_IDENTIFIER" "$PBXPROJ"

      - name: Locate and build Xcode project
        run: |
          XCODEPROJ=$(find .output/safari-xcode -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          echo "Found project: $XCODEPROJ"
          PROJECT_DIR=$(dirname "$XCODEPROJ")
          PROJECT_FILE=$(basename "$XCODEPROJ")
          cd "$PROJECT_DIR"

          echo "Available schemes:"
          xcodebuild -project "$PROJECT_FILE" -list

          SCHEME_NAME=$(xcodebuild -project "$PROJECT_FILE" -list | \
            awk '/Schemes:/{flag=1; next} flag && NF{print; exit}' | \
            sed 's/^[ \t]*//')
          echo "Using scheme: '$SCHEME_NAME'"

          xcodebuild -project "$PROJECT_FILE" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/.output/safari-build" \
            build

      - name: Zip the built app
        run: |
          APP_PATH=$(find .output/safari-build -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found app: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" .output/safari-app.zip

      - name: Upload Safari build to release
        uses: softprops/action-gh-release@v2
        with:
          files: .output/safari-app.zip